<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BDMCS48SE Instrument</title>
  <!-- Entrada de Vite: el CSS entra por el import de src/main.js -->
  <script type="module" src="/src/main.js"></script>
</head>
<body data-theme="audiolab" class="theme-audiolab skin-audiolab chassis">
  <div id="app">
    <!-- Barra de Menús Superior Universal ABDShared (SynthNavBar) -->
    <div id="navBarContainer"></div>

    <!-- Barra de Herramientas de Presets y Control Rápido (Sub-header) -->
    <header id="synthToolbar" class="synth-toolbar">
      <div class="toolbar-section toolbar-presets">
        <span class="toolbar-label" data-i18n="toolbar.presetLabel">PRESET:</span>
        <select id="preset-list" class="preset-select-dropdown" aria-label="Presets guardados"></select>
        <input id="preset-name" type="text" class="preset-name-input" value="Init" spellcheck="false" title="Nombre del preset" data-i18n-title="toolbar.presetNameTitle">
        <button id="preset-save" type="button" class="btn btn-sm" title="Guardar Preset" data-i18n-title="toolbar.presetSaveTitle">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          <span data-i18n="toolbar.presetSave">Guardar</span>
        </button>
        <button id="preset-load" type="button" class="btn btn-sm" title="Cargar Preset" data-i18n-title="toolbar.presetLoadTitle">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 15v4c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2v-4M17 9l-5 5-5-5M12 12.8V2.5"></path></svg>
          <span data-i18n="toolbar.presetLoad">Cargar</span>
        </button>
      </div>

      <div class="toolbar-section toolbar-firmware">
        <span class="toolbar-label" data-i18n="toolbar.firmwareLabel">FIRMWARE:</span>
        <button id="toolbarFwBadge" type="button" class="toolbar-firmware-pill" title="Clic para abrir Gestor de Firmware y ROMs" data-i18n-title="toolbar.firmwareBadgeTitle">
          <span class="toolbar-fw-led"></span>
          <span id="toolbarFwName">MCS-48 Enhanced Mono Voice</span>
        </button>
      </div>

      <div class="toolbar-section toolbar-quick-actions">
        <button id="toolbarPanicBtn" type="button" class="btn btn-sm btn-panic" title="Panic: Apagar todas las notas (Ctrl+Q)" data-i18n="toolbar.panicBtn" data-i18n-title="toolbar.panicTitle">
          PANIC
        </button>
        <button id="toolbarResetCpuBtn" type="button" class="btn btn-sm" title="Reiniciar CPU MCS-48" data-i18n="toolbar.resetCpuBtn" data-i18n-title="toolbar.resetCpuTitle">
          RESET CPU
        </button>
      </div>
    </header>

    <!-- Escenario Principal del Sintetizador (Montado canónicamente desde ABDShared) -->
    <main id="synthStage" class="synth-stage"></main>

    <!-- Virtual Keyboard Footer (Fixed Bottom, como en ABDMS2000) -->
    <footer class="keyboard-container" id="synth-keyboard-footer">
      <div class="keyboard-lower-section">
        <!-- Vertical Octave Controls -->
        <div class="kbd-octave-controls">
          <button id="oct-up" class="kbd-octave-btn" title="Octave Up">
            <span>OCT +</span>
            <div class="kbd-octave-led" id="led-up"></div>
          </button>
          <button id="oct-down" class="kbd-octave-btn" title="Octave Down">
            <span>OCT -</span>
            <div class="kbd-octave-led" id="led-down"></div>
          </button>
        </div>

        <!-- Keybed Performance Surface -->
        <div id="piano-keyboard"></div>

        <!-- Utility Controls (Sustain & Panic) -->
        <div class="kbd-utility-controls">
          <button id="sustain-btn" class="kbd-octave-btn kbd-utility-btn" title="Sustain Pedal (Ctrl+Space)">
            <span>SUST</span>
            <div class="kbd-octave-led kbd-sustain-led" id="led-sustain"></div>
          </button>
          <button id="panic-btn" class="kbd-octave-btn kbd-utility-btn" title="All Notes Off / Panic (Ctrl+Q)">
            <span>PANIC</span>
            <div class="kbd-octave-led kbd-panic-led" id="led-panic"></div>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Punto de Montaje del Drawer Lateral para Firmware & ROMs (montado en body fuera de #app) -->
  <div id="firmwareDrawerMount"></div>
</body>
</html>
